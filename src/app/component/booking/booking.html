<section id="Booking" class="py-5">
    <h2 class="text-center mb-4">Book Now</h2>
    <form action="#">
        <div class="input-groups mb-3">
            <label for="name"> Name :</label>
            <input type="text" id="name" required name="name">
        </div>
        <div class="input-groups mb-3">
            <label for="people">How many people :</label>
            <input type="text" id="people" required name="howManyPeople">
        </div>
        <div class="input-groups mb-3">
            <label for="date">Date :</label>
            <input type="datetime-local" id="date" required name="date">
        </div>
        <div class="input-groups mb-3">
            <label for="message"> message :</label>
            <textarea name="message" id="message" type="text" required></textarea>
        </div>
        <button class="w-100">Book</button>
    </form>
</section>
